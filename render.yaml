services:
  - type: web
    name: king-md-engine
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: king-md-pair-sessions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PAIR_SESSION_DIR
        value: /var/data/pair_sessions
